app:
  name: "RAG Pipeline Backend"
  version: "0.1.0"
  description: "FastAPI Backend for Modular RAG Pipeline"
  api_prefix: "/api/v1"

rag:
  ocr:
    enabled: true
    engine: "tesseract"
    language: "eng"
    tesseract_cmd: null
  embedding:
    model_name: "BAAI/bge-small-en-v1.5"
    dimension: 384
    batch_size: 32
    device: "cpu"
    normalize_embeddings: true
  chunking:
    chunk_size: 512
    chunk_overlap: 64
    separator: "\n\n"
  vector_db:
    provider: "chromadb"
    collection_name: "rag_documents"
    persist_directory: "data/indexes/chroma"
    distance_metric: "cosine"
    batch_size: 100
  retrieval:
    top_k: 5
    candidate_k: 10
    similarity_threshold: 0.50
    min_relevant_chunks: 1
    max_context_chunks: 10
  llm:
    provider: "openai-compatible"
    base_url: "https://exo.manysphere.info/v1"
    model: "mlx-community/Qwen3.6-35B-A3B-4bit"
    temperature: 0.0
    max_tokens: 1024
    timeout_seconds: 60
